# Render Blueprint — Sai Prasad Driving School API
#
# Usage:
#   1. Push this repo to GitHub
#   2. Render Dashboard -> New -> Blueprint
#   3. Select the repo, apply this blueprint
#   4. Set MONGODB_URI and JWT_SECRET in the Render dashboard
#
# Or create a Web Service manually (see README for step-by-step).

services:
  - type: web
    name: sai-prasad-driving-school-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BUSINESS_TIMEZONE
        value: Asia/Kolkata
      - key: RATE_LIMIT_MAX
        value: 200
      # Set these in the Render dashboard (they contain your own values)
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
